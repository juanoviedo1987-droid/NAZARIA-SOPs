<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nazaria · Validador de Cupones en Caja</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FAF9F6;
      color: #1A1A1A;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-badge {
      animation: pulse-ring 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5">

  <!-- ENCABEZADO OFICIAL UNIFICADO -->
  <header class="w-full max-w-lg text-center space-y-2 mb-2">
    <div class="flex items-center justify-between border-b border-neutral-200 pb-2.5">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-neutral-900 text-white flex items-center justify-center font-bold text-lg shadow-sm">
          ⚡
        </div>
        <div class="text-left">
          <h1 class="font-black text-sm sm:text-base text-neutral-900 leading-tight">Validador de Cupones en Caja</h1>
          <p class="text-[11px] text-neutral-500 font-medium">Nazaria Zapatos · TOM &amp; Maschwitz Mall</p>
        </div>
      </div>
      <a href="index.html#p14" class="text-[11px] font-bold text-neutral-600 hover:text-black underline flex items-center gap-1 bg-neutral-100 px-2 py-1 rounded-lg">
        <span>📖</span> SOP P-14
      </a>
    </div>

    <!-- Indicador de Sincronización en Vivo -->
    <div class="flex items-center justify-between px-1 text-[11px]">
      <span class="inline-flex items-center gap-1.5 text-emerald-800 font-bold bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200 text-[10px]">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Nube en vivo (cada 30s)
      </span>
      <span id="sync-counter" class="text-neutral-400 font-semibold text-[10.5px]">Actualizando...</span>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DEL VALIDADOR -->
  <main class="w-full max-w-lg bg-white rounded-3xl border-2 border-neutral-200 p-4 sm:p-5 shadow-lg space-y-4 my-auto">
    
    <!-- BUSCADOR SIMPLE Y DESTACADO -->
    <div>
      <label for="code-input" class="block text-[11px] font-black text-neutral-700 uppercase tracking-wider mb-1.5 flex items-center justify-between">
        <span>1. Ingresá el código del cupón:</span>
        <span class="text-neutral-400 font-normal lowercase">(4 dígitos)</span>
      </label>
      <div class="relative flex items-center">
        <span class="absolute left-3.5 font-mono font-bold text-neutral-400 text-lg select-none pointer-events-none">
          NTM-
        </span>
        <input type="text" id="code-input" placeholder="4821" maxlength="9" autofocus autocomplete="off" inputmode="numeric"
          class="w-full pl-20 pr-28 py-3.5 bg-neutral-50 border-2 border-neutral-300 rounded-2xl font-mono text-2xl font-black text-neutral-900 tracking-wider focus:bg-white focus:outline-none focus:border-neutral-900 transition shadow-inner"
          onkeydown="if(event.key==='Enter') searchCoupon()">
        <button onclick="searchCoupon()" class="absolute right-1.5 px-3.5 py-2.5 bg-neutral-900 hover:bg-black active:scale-95 text-white text-xs font-black rounded-xl transition shadow-sm flex items-center gap-1">
          <span>CONSULTAR</span>
        </button>
      </div>
      <p class="text-[11px] text-neutral-500 mt-1.5 font-medium">
        💡 Escribí solo los 4 números (ej: <strong class="text-neutral-900">4821</strong>) y tocá <strong>Consultar</strong> o <strong>Enter</strong>.
      </p>
    </div>

    <!-- SPINNER DE CARGA -->
    <div id="loader" class="hidden text-center py-8 space-y-2">
      <div class="w-8 h-8 border-3 border-neutral-900 border-t-transparent rounded-full animate-spin mx-auto"></div>
      <p class="text-xs text-neutral-700 font-bold">Verificando en la base central...</p>
    </div>

    <!-- TARJETA: RESULTADO DE LA BÚSQUEDA (SEMÁFORO VISUAL) -->
    <div id="result-card" class="hidden"></div>

  </main>

  <!-- HISTORIAL GENERAL DEL DÍA (TOM & MASCHWITZ) -->
  <footer class="w-full max-w-lg mt-3 space-y-2">
    <div class="flex items-center justify-between text-xs font-black text-neutral-700 px-1">
      <span class="flex items-center gap-1.5">
        <span>📋</span> Cupones Canjeados Hoy
        <span id="redeemed-badge-count" class="bg-neutral-900 text-white font-mono text-[10px] px-2 py-0.2 rounded-full font-bold">0</span>
      </span>
      <button onclick="loadRedeemedToday()" class="text-[11px] text-neutral-500 hover:text-black font-bold underline flex items-center gap-1">
        <span>🔄</span> Actualizar
      </button>
    </div>
    
    <div id="recent-list-container" class="bg-white rounded-2xl border border-neutral-200 p-2.5 max-h-44 overflow-y-auto text-xs divide-y divide-neutral-100 shadow-sm">
      <p class="text-[11px] text-neutral-400 text-center py-2">Cargando registros del día...</p>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = 'https://hlvovocufifroigdlhmv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhsdm92b2N1Zmlmcm9pZ2RsaG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDM3MjksImV4cCI6MjEwNTY3OTcyOX0.7KGejvoqjyTAZhEGYODz_Jm2DpddYiLUyIKdhhLxsr0';

    let currentCouponRecord = null;
    let autoRefreshTimer = null;

    window.onload = function() {
      document.getElementById('code-input').focus();
      loadRedeemedToday();

      // Auto-actualización cada 30 segundos
      autoRefreshTimer = setInterval(() => {
        loadRedeemedToday();
      }, 30000);
    };

    function normalizeCode(raw) {
      let code = (raw || "").trim().toUpperCase();
      if (!code) return "";
      if (/^\d{4}$/.test(code)) {
        code = "NTM-" + code;
      }
      return code;
    }

    async function searchCoupon() {
      const input = document.getElementById('code-input');
      const raw = input.value;
      const code = normalizeCode(raw);

      if (!code) {
        input.focus();
        return;
      }

      const loader = document.getElementById('loader');
      const resultCard = document.getElementById('result-card');

      loader.classList.remove('hidden');
      resultCard.classList.add('hidden');
      resultCard.innerHTML = "";

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/fechas_especiales?evento=eq.CUPON_RULETA&manana=eq.${encodeURIComponent(code)}&select=*`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          }
        });

        const data = await res.json();
        loader.classList.add('hidden');
        resultCard.classList.remove('hidden');

        if (!data || data.length === 0) {
          renderNotFound(code);
          return;
        }

        const record = data[0];
        currentCouponRecord = record;
        renderCouponState(record);

      } catch (err) {
        loader.classList.add('hidden');
        resultCard.classList.remove('hidden');
        resultCard.innerHTML = `
          <div class="p-4 bg-red-50 text-red-900 rounded-2xl border-2 border-red-200 text-center font-bold text-xs space-y-2">
            <div>⚠️ Error de conexión con la nube.</div>
            <button onclick="searchCoupon()" class="px-3 py-1 bg-red-800 text-white rounded-lg text-[11px]">Reintentar</button>
          </div>
        `;
      }
    }

    function renderNotFound(code) {
      const resultCard = document.getElementById('result-card');
      resultCard.innerHTML = `
        <div class="p-5 bg-neutral-100 border-2 border-neutral-300 rounded-2xl text-center space-y-3">
          <div class="w-14 h-14 mx-auto rounded-full bg-neutral-200 text-neutral-600 flex items-center justify-center text-3xl font-black">
            ❓
          </div>
          <div>
            <span class="bg-neutral-800 text-white font-black text-[10px] px-2.5 py-0.5 rounded-full uppercase tracking-wider">
              NO REGISTRADO
            </span>
            <h2 class="text-xl font-black text-neutral-900 font-mono mt-1">
              ${code}
            </h2>
          </div>
          <p class="text-xs text-neutral-600 leading-snug">
            Este código <strong>no existe</strong> en la ruleta oficial.<br>
            Pedile a la clienta que te muestre la pantalla de su celular para verificar el número.
          </p>
          <button onclick="resetSearch()" class="mt-1 py-2 px-4 bg-neutral-900 hover:bg-black text-white text-xs font-bold rounded-xl transition">
            Probar otro código ➔
          </button>
        </div>
      `;
    }

    function renderCouponState(record) {
      const resultCard = document.getElementById('result-card');
      let details = {};
      try { details = JSON.parse(record.observacion || "{}"); } catch(e) {}

      const isRedeemed = (record.tarde === 'CANJEADO');
      const now = Date.now();
      const expiresAt = details.couponExpiresAt || (new Date(record.creado_en).getTime() + 2 * 3600 * 1000);
      const isExpired = (!isRedeemed && expiresAt < now);

      // CASO 1: YA CANJEADO (SEMÁFORO ROJO GIGANTE - RECHAZO TOTAL)
      if (isRedeemed) {
        const redeemedDate = details.redeemedAt ? new Date(details.redeemedAt) : new Date(record.creado_en);
        const timeStr = redeemedDate.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        const dateStr = redeemedDate.toLocaleDateString('es-AR');
        const branchName = (record.sucursal_codigo === 'MASCHWITZ') ? 'Maschwitz Mall' : 'TOM Shopping';

        resultCard.innerHTML = `
          <div class="p-5 bg-red-50 border-3 border-red-500 rounded-2xl space-y-3.5 text-center shadow-md">
            <!-- Icono gigante de stop -->
            <div class="w-16 h-16 mx-auto rounded-full bg-red-600 text-white flex items-center justify-center text-3xl font-black shadow-lg">
              ✕
            </div>
            
            <div>
              <span class="bg-red-600 text-white font-black text-[11px] px-3 py-1 rounded-full uppercase tracking-widest">
                ⛔ RECHAZAR: YA FUE CANJEADO
              </span>
              <h2 class="text-2xl font-black text-red-950 mt-1 font-mono tracking-wider">
                ${record.manana}
              </h2>
            </div>

            <!-- Ficha clara de auditoría -->
            <div class="p-3 bg-white rounded-xl border-2 border-red-200 text-xs text-left space-y-1.5 shadow-inner">
              <div class="flex items-center justify-between border-b border-red-100 pb-1">
                <span class="text-neutral-500 font-semibold">Local de canje:</span>
                <span class="font-black text-red-700 bg-red-100 px-2 py-0.5 rounded">${branchName}</span>
              </div>
              <div class="flex items-center justify-between border-b border-red-100 pb-1">
                <span class="text-neutral-500 font-semibold">Hora de quemado:</span>
                <span class="font-bold text-neutral-900">${dateStr} · ${timeStr} hs</span>
              </div>
              <div class="flex items-center justify-between border-b border-red-100 pb-1">
                <span class="text-neutral-500 font-semibold">Clienta:</span>
                <span class="font-bold text-neutral-900">${details.name || 'Sin nombre'}</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-neutral-500 font-semibold">Premio original:</span>
                <span class="font-bold text-neutral-900">${details.prizeTitle || ''} ${details.prizeSub || ''}</span>
              </div>
            </div>

            <div class="p-3 bg-red-600 text-white rounded-xl text-xs font-black uppercase tracking-wider shadow-sm">
              🚫 NO APLICAR DESCUENTO (CUPÓN DUPLICADO)
            </div>

            <button onclick="resetSearch()" class="text-xs font-bold text-neutral-700 hover:text-black underline pt-1 block mx-auto">
              Verificar otro cupón ➔
            </button>
          </div>
        `;
        return;
      }

      // CASO 2: VENCIDO (> 2 HORAS) (SEMÁFORO AMARILLO)
      if (isExpired) {
        const expDate = new Date(expiresAt).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        resultCard.innerHTML = `
          <div class="p-5 bg-amber-50 border-3 border-amber-400 rounded-2xl space-y-3 text-center shadow-md">
            <div class="w-16 h-16 mx-auto rounded-full bg-amber-400 text-amber-950 flex items-center justify-center text-3xl font-black shadow-sm">
              ⏱️
            </div>
            
            <div>
              <span class="bg-amber-400 text-amber-950 font-black text-[11px] px-3 py-1 rounded-full uppercase tracking-wider">
                ⚠️ CUPÓN VENCIDO (> 2 HORAS)
              </span>
              <h2 class="text-2xl font-black text-amber-950 mt-1 font-mono">
                ${record.manana}
              </h2>
            </div>

            <div class="p-3 bg-white rounded-xl border border-amber-200 text-xs text-neutral-700 leading-snug">
              Expiró hoy a las <strong>${expDate} hs</strong>.<br>
              El plazo de validez de 2 horas desde el giro ha finalizado.
            </div>

            <div class="p-2.5 bg-amber-200 text-amber-950 rounded-xl text-xs font-black uppercase tracking-wide">
              NO VÁLIDO PARA CANJE
            </div>

            <button onclick="resetSearch()" class="text-xs font-bold text-neutral-700 underline pt-1 block mx-auto">
              Verificar otro código ➔
            </button>
          </div>
        `;
        return;
      }

      // CASO 3: VÁLIDO & ACTIVO (SEMÁFORO VERDE GIGANTE - FOOLPROOF)
      const diffMs = expiresAt - now;
      const minLeft = Math.max(1, Math.floor(diffMs / (60 * 1000)));

      // Determinar estilo visual según el tipo de premio
      let prizeBg = "from-emerald-500 to-teal-700";
      let icon = "🎁";
      let duxHint = "Cargar como Bonificación en Dux ERP";
      const prizeTitle = (details.prizeTitle || "").toUpperCase();

      if (prizeTitle.includes("$15.000") || prizeTitle.includes("$10.000") || prizeTitle.includes("$5.000")) {
        prizeBg = "from-emerald-600 to-green-700";
        icon = "💵";
        duxHint = `Descontar ${details.prizeTitle} en Dux como Bonificación Especial`;
      } else if (prizeTitle.includes("%")) {
        prizeBg = "from-purple-600 to-indigo-700";
        icon = "🏷️";
        duxHint = `Aplicar ${details.prizeTitle} en la 2da unidad de menor valor`;
      } else if (prizeTitle.includes("EXTRA")) {
        prizeBg = "from-blue-600 to-sky-700";
        icon = "⚡";
        duxHint = `Sumar ${details.prizeTitle} acumulable con Efectivo o Débito`;
      }

      resultCard.innerHTML = `
        <div class="p-5 bg-emerald-50 border-3 border-emerald-500 rounded-3xl space-y-4 shadow-xl">
          
          <!-- Encabezado de Éxito -->
          <div class="flex items-center justify-between">
            <span class="inline-flex items-center gap-1.5 bg-emerald-600 text-white font-black text-xs px-3 py-1 rounded-full uppercase tracking-wider shadow-sm pulse-badge">
              <span class="text-sm">✓</span> CUPÓN VÁLIDO
            </span>
            <span class="text-xs font-bold text-emerald-900 bg-emerald-200/70 px-2.5 py-1 rounded-full flex items-center gap-1">
              <span>⏱️</span> Quedan ${minLeft} min
            </span>
          </div>

          <!-- TARJETA PROTAGÓNICA DEL BENEFICIO (GIGANTE Y MUY VISUAL) -->
          <div class="bg-gradient-to-r ${prizeBg} text-white p-4 rounded-2xl shadow-lg space-y-2 text-center">
            <div class="text-xs font-mono font-bold tracking-widest opacity-80 uppercase">
              CÓDIGO: ${record.manana}
            </div>
            
            <div class="text-3xl sm:text-4xl font-black tracking-tight drop-shadow-sm flex items-center justify-center gap-2">
              <span>${icon}</span>
              <span>${details.prizeTitle || ''}</span>
            </div>

            <div class="text-sm font-bold tracking-wide uppercase bg-black/20 py-1 px-3 rounded-lg inline-block">
              ${details.prizeSub || ''}
            </div>

            <div class="text-xs font-medium text-white/90 bg-white/10 p-2 rounded-xl mt-1 border border-white/20">
              📌 <strong>Condición:</strong> ${details.condition || 'Válido para calzado temporada nueva'}
            </div>
          </div>

          <!-- DATOS DE LA CLIENTA -->
          <div class="flex items-center justify-between bg-white px-3.5 py-2.5 rounded-xl border border-emerald-200 text-xs">
            <span class="text-neutral-500 font-semibold">Clienta en caja:</span>
            <span class="font-black text-neutral-900 text-sm">${details.name || 'Clienta'}</span>
          </div>

          <!-- INSTRUCCIÓN DE ACCIÓN PARA LA CAJERA -->
          <div class="p-2.5 bg-neutral-900 text-neutral-100 rounded-xl text-xs space-y-1">
            <div class="font-bold text-amber-300 flex items-center gap-1">
              <span>💻</span> INSTRUCCIÓN DUX ERP:
            </div>
            <div class="text-[11.5px] font-medium leading-tight">
              ${duxHint}. Colocar <strong>${record.manana}</strong> en las notas de la venta.
            </div>
          </div>

          <!-- BOTONES DE QUEMADO INMEDIATO (UN TOQUE) -->
          <div class="space-y-2 pt-1">
            <div class="text-[11px] font-black text-neutral-700 uppercase tracking-wider text-center">
              👉 Tocá tu local para QUEMAR el cupón ahora:
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="redeemCouponNow('${record.id}', 'TOM')"
                class="py-3.5 px-3 bg-neutral-900 hover:bg-black active:scale-95 text-white font-black text-xs rounded-2xl transition shadow-lg flex flex-col items-center justify-center gap-1 border-2 border-neutral-700">
                <span class="text-lg">🛍️</span>
                <span>QUEMAR EN TOM</span>
              </button>
              <button onclick="redeemCouponNow('${record.id}', 'MASCHWITZ')"
                class="py-3.5 px-3 bg-neutral-900 hover:bg-black active:scale-95 text-white font-black text-xs rounded-2xl transition shadow-lg flex flex-col items-center justify-center gap-1 border-2 border-neutral-700">
                <span class="text-lg">🛍️</span>
                <span>QUEMAR EN MASCHWITZ</span>
              </button>
            </div>
          </div>

          <p class="text-[10px] text-neutral-500 text-center font-medium">
            Al tocar el botón, se bloquea al instante para que no pueda usarse nunca más.
          </p>
        </div>
      `;
    }

    async function redeemCouponNow(recordId, branch) {
      if (!currentCouponRecord) return;

      const resultCard = document.getElementById('result-card');
      resultCard.innerHTML = `
        <div class="p-8 bg-white border-2 border-neutral-200 rounded-3xl text-center space-y-3 shadow-md">
          <div class="w-8 h-8 border-3 border-neutral-900 border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p class="text-sm font-bold text-neutral-800">Quemando cupón en tiempo real...</p>
        </div>
      `;

      let details = {};
      try { details = JSON.parse(currentCouponRecord.observacion || "{}"); } catch(e) {}
      details.redeemedAt = Date.now();
      details.redeemedBranch = branch;

      try {
        await fetch(`${SUPABASE_URL}/rest/v1/fechas_especiales?id=eq.${recordId}`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            tarde: 'CANJEADO',
            sucursal_codigo: branch,
            observacion: JSON.stringify(details)
          })
        });

        // PANTALLA DE ÉXITO VISUAL PARA LA CAJERA
        resultCard.innerHTML = `
          <div class="p-6 bg-neutral-900 text-white rounded-3xl text-center space-y-3.5 border-2 border-emerald-500 shadow-2xl">
            <div class="w-16 h-16 mx-auto rounded-full bg-emerald-500 text-neutral-950 flex items-center justify-center text-3xl font-black shadow-lg">
              ✓
            </div>
            <div>
              <span class="bg-emerald-500 text-neutral-950 font-black text-[11px] px-3 py-1 rounded-full uppercase tracking-wider">
                ¡CUPÓN QUEMADO EXITOSAMENTE!
              </span>
              <h2 class="text-2xl font-black text-amber-300 font-mono mt-1">
                ${currentCouponRecord.manana}
              </h2>
            </div>
            
            <div class="p-3 bg-neutral-800/80 rounded-xl border border-neutral-700 text-xs text-neutral-300 leading-snug">
              Registrado como <strong>CANJEADO</strong> en <strong>${branch === 'MASCHWITZ' ? 'Maschwitz Mall' : 'TOM Shopping'}</strong>.<br>
              ¡Ya no podrá ser reutilizado en ningún local!
            </div>

            <button onclick="resetSearch()" class="w-full py-3.5 px-4 bg-white hover:bg-neutral-100 active:scale-95 text-neutral-900 font-black text-xs rounded-xl transition shadow-lg">
              Validar Siguiente Cupón ➔
            </button>
          </div>
        `;

        loadRedeemedToday();

      } catch (err) {
        alert("Error de conexión al quemar cupón. Reintentar.");
        searchCoupon();
      }
    }

    function resetSearch() {
      document.getElementById('result-card').classList.add('hidden');
      const input = document.getElementById('code-input');
      input.value = "";
      input.focus();
    }

    async function loadRedeemedToday() {
      const listContainer = document.getElementById('recent-list-container');
      const countBadge = document.getElementById('redeemed-badge-count');
      const syncCounter = document.getElementById('sync-counter');

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/fechas_especiales?evento=eq.CUPON_RULETA&tarde=eq.CANJEADO&order=creado_en.desc&limit=20`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          }
        });

        const list = await res.json();
        const now = new Date();
        syncCounter.innerText = `Sincronizado ${now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })} hs`;

        if (!list || list.length === 0) {
          countBadge.innerText = "0";
          listContainer.innerHTML = `<p class="text-[11px] text-neutral-400 text-center py-2 font-medium">No hay cupones canjeados hoy en ninguna sucursal.</p>`;
          return;
        }

        countBadge.innerText = String(list.length);

        listContainer.innerHTML = list.map(item => {
          let det = {};
          try { det = JSON.parse(item.observacion || "{}"); } catch(e) {}
          const time = det.redeemedAt ? new Date(det.redeemedAt).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) : '--:--';
          const branchBadge = item.sucursal_codigo === 'MASCHWITZ' 
            ? '<span class="bg-amber-100 text-amber-900 font-black px-1.5 py-0.5 rounded text-[10px]">MASCHWITZ</span>'
            : '<span class="bg-blue-100 text-blue-900 font-black px-1.5 py-0.5 rounded text-[10px]">TOM</span>';

          return `
            <div class="py-2.5 flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 flex-wrap">
                ${branchBadge}
                <span class="font-mono font-bold text-neutral-900 text-xs">${item.manana}</span>
                <span class="text-neutral-600 text-[11px] font-medium">${det.prizeTitle || ''} ${det.prizeSub || ''}</span>
              </div>
              <div class="text-[11px] font-bold text-neutral-400 shrink-0">
                ${time} hs
              </div>
            </div>
          `;
        }).join('');

      } catch (e) {
        listContainer.innerHTML = `<p class="text-[11px] text-red-500 text-center py-2 font-medium">Error al sincronizar historial.</p>`;
      }
    }
  </script>
</body>
</html>
