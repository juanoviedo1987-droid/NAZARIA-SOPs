<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Box Gradients -->
    <linearGradient id="boxGradFront" x1="50" y1="90" x2="150" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF5EE"/>
      <stop offset="0.5" stop-color="#EADECE"/>
      <stop offset="1" stop-color="#C5AA8C"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="40" y1="65" x2="160" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#EADECE"/>
      <stop offset="1" stop-color="#A68764"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF2D6"/>
      <stop offset="0.4" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8C6A24"/>
    </linearGradient>
    <linearGradient id="darkRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2C2C2C"/>
      <stop offset="0.5" stop-color="#141414"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <filter id="boxShadow" x="20" y="50" width="160" height="150" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#8C6A48" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#boxShadow)">
    <!-- Box Body -->
    <rect x="52" y="90" width="96" height="85" rx="10" fill="url(#boxGradFront)" stroke="#C5AA8C" stroke-width="2"/>

    <!-- Vertical Ribbon on Body -->
    <rect x="90" y="90" width="20" height="85" fill="url(#goldRibbon)"/>
    <rect x="98" y="90" width="4" height="85" fill="#FFF5DC" opacity="0.6"/>

    <!-- Lid -->
    <rect x="44" y="70" width="112" height="24" rx="6" fill="url(#lidGrad)" stroke="#B89B77" stroke-width="1.5"/>
    <rect x="90" y="70" width="20" height="24" fill="url(#goldRibbon)"/>
    <rect x="98" y="70" width="4" height="24" fill="#FFF5DC" opacity="0.6"/>

    <!-- Ribbon Bow Top Left Loop -->
    <path d="M100 70 C80 50, 55 45, 68 62 C78 72, 92 70, 100 70 Z" fill="url(#goldRibbon)" stroke="#8C6A24" stroke-width="1"/>
    <!-- Ribbon Bow Top Right Loop -->
    <path d="M100 70 C120 50, 145 45, 132 62 C122 72, 108 70, 100 70 Z" fill="url(#goldRibbon)" stroke="#8C6A24" stroke-width="1"/>
    <!-- Bow Knot -->
    <ellipse cx="100" cy="70" rx="9" ry="8" fill="url(#goldRibbon)" stroke="#8C6A24" stroke-width="1"/>
    <ellipse cx="98" cy="68" rx="4" ry="3" fill="#FFF8E7" opacity="0.8"/>
  </g>

  <!-- Sparkles -->
  <path d="M165 55 Q168 65 178 68 Q168 71 165 81 Q162 71 152 68 Q162 65 165 55 Z" fill="#D4AF37"/>
  <circle cx="165" cy="68" r="2" fill="#FFF"/>
  <path d="M35 110 Q37 117 44 119 Q37 121 35 128 Q33 121 26 119 Q33 117 35 110 Z" fill="#D4AF37"/>
  <circle cx="145" cy="140" r="3" fill="#E6D5C3"/>
  <circle cx="48" cy="75" r="2.5" fill="#E6D5C3"/>
</svg>