<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afiche Oficial de Vidriera · Ruleta Nazaria</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }
    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .poster-wrapper {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        max-width: none !important;
        border-radius: 0 !important;
      }
      img.poster-img {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: fill !important;
      }
    }
    body {
      background: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 text-white select-none">

  <!-- BARRA SUPERIOR DE ACCIONES (NO SE IMPRIME) -->
  <header class="no-print w-full max-w-[820px] flex flex-wrap items-center justify-between gap-3 mb-4 bg-neutral-900/90 backdrop-blur-md p-3.5 rounded-2xl border border-neutral-800 shadow-xl">
    <div class="flex items-center gap-2.5">
      <span class="text-xl">🪟</span>
      <div>
        <h1 class="text-xs sm:text-sm font-black text-white tracking-wide uppercase leading-tight">
          Afiche Oficial de Vidriera
        </h1>
        <p class="text-[11px] text-neutral-400 font-medium">
          Nazaria Zapatos · Tamaño A4 / Vidriera Shopping (TOM &amp; Maschwitz)
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <a href="index.html" target="_blank"
        class="px-3 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-xs font-bold rounded-xl transition flex items-center gap-1.5 border border-neutral-700">
        <span>📱 Probar App</span>
      </a>
      <a href="afiche_oficial_vidriera.jpg" download="Afiche_Vidriera_Nazaria_HD.jpg"
        class="px-3 py-2 bg-neutral-800 hover:bg-neutral-700 text-amber-300 text-xs font-bold rounded-xl transition flex items-center gap-1.5 border border-neutral-700">
        <span>⬇️ Descargar HD</span>
      </a>
      <button onclick="window.print()"
        class="px-4 py-2 bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white text-xs font-black rounded-xl transition shadow-lg flex items-center gap-1.5 active:scale-95">
        <span>🖨️ IMPRIMIR A4</span>
      </button>
    </div>
  </header>

  <!-- CONTENEDOR DEL AFICHE A4 OFICIAL -->
  <main class="poster-wrapper relative w-full max-w-[794px] aspect-[1/1.414] bg-neutral-950 rounded-2xl overflow-hidden shadow-[0_20px_70px_rgba(0,0,0,0.8)] border border-neutral-800 flex items-center justify-center">
    <img src="afiche_oficial_vidriera.jpg" alt="Afiche Oficial de Vidriera Ruleta Nazaria"
      class="poster-img w-full h-full object-contain select-none">
  </main>

  <!-- PIE INFORMATIVO -->
  <footer class="no-print mt-4 text-center text-xs text-neutral-500">
    <p>Para imprimir sin bordes en imprenta o papel ilustración A4: presionar <strong>Imprimir A4</strong> y seleccionar escala <em>"Ajustar a la página"</em> o <em>100%</em>.</p>
  </footer>

</body>
</html>
