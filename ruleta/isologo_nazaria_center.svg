<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <clipPath id="horizontalFeetCut">
      <!-- Clip the bottom so feet are cut cleanly horizontal at y=172 -->
      <rect x="0" y="0" width="200" height="172" />
    </clipPath>
  </defs>
  <!-- Base circular blanca pura impecable -->
  <circle cx="100" cy="100" r="95" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2.5" filter="url(#subtleShadow)"/>
  
  <!-- Isologo Oficial Nazaria: Runa estilizada con vértice superior continuo en punta y corte horizontal en la base -->
  <g clip-path="url(#horizontalFeetCut)">
    <path d="M 143 182 L 100 137 L 44 81 L 100 25 L 156 81 L 100 137 L 57 182"
          fill="none" 
          stroke="#111111" 
          stroke-width="15.5" 
          stroke-linecap="butt" 
          stroke-linejoin="miter" 
          stroke-miterlimit="10" />
  </g>
</svg>