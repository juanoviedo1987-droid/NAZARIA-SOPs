<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="domeBg" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#E5DDD3" />
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Fondo circular blanco con bisel sutil -->
  <circle cx="100" cy="100" r="95" fill="url(#domeBg)" stroke="#FFFFFF" stroke-width="6" filter="url(#subtleGlow)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#D8C8B8" stroke-width="2"/>
  
  <!-- Isologo Nazaria centrado milimétricamente (Runa Othala) -->
  <g fill="none" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="miter">
    <!-- Trazado continuo simétrico -->
    <path d="M 68 146 L 100 114 L 132 82 L 100 50 L 68 82 L 100 114 L 132 146" />
  </g>
</svg>